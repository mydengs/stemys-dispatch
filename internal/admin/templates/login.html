{{define "content"}}
<div class="login">
  <div class="card">
    <h1>◇ 分发后台</h1>
    <p class="muted" style="text-align:center;margin-bottom:22px;font-size:13px">请登录管理推广分发</p>
    <form method="post" action="/admin/login">
      <div class="field"><label>用户名</label><input type="text" name="username" autofocus required></div>
      <div class="field"><label>密码</label><input type="password" name="password" required></div>
      <button class="btn" style="width:100%" type="submit">登录</button>
    </form>
  </div>
</div>
{{end}}
